<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 ALERTA DE VAZAMENTO 🚨</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: "Courier New", monospace;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .danger {
            color: red;
            font-size: 1.5em;
            animation: piscar 1s infinite;
            margin-bottom: 20px;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .terminal {
            margin: 0 auto 20px auto;
            width: 95%;
            max-width: 500px;
            text-align: left;
            border: 2px solid lime;
            padding: 15px;
            background-color: #111;
            font-size: 0.9em;
        }

        .typing {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            animation: typing 6s steps(60, end), blink 0.75s step-end infinite;
            border-right: 2px solid lime;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        .fake-button {
            padding: 10px 20px;
            background-color: red;
            color: white;
            border: none;
            font-size: 1em;
            cursor: pointer;
            animation: piscar 1.5s infinite;
        }
    </style>
</head>
<body>

    <div class="danger">🚨 ALERTA: VAZAMENTO DETECTADO! 🚨</div>

    <div class="terminal">
        <div class="typing">
            Conectando a servidores globais...<br>
            Vazamento em: EUA, Brasil, China...<br>
            Extraindo dados...<br>
            CPF: 043.351.866-90<br>
            Nome: Denilson Francisco Batista<br>
            Banco: Caixa Econômica<br>
            PIX em processamento R$500,00... 100%
        </div>
    </div>

    <button class="fake-button" onclick="alert('Muito tarde... seus dados já foram enviados 😈')">
        PARAR VAZAMENTO
    </button>

    <audio id="alarm" autoplay loop>
        <source src="https://www.soundjay.com/button/beep-09.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio embutido.
    </audio>

    <script>
        document.body.addEventListener('click', function () {
            const alarm = document.getElementById('alarm');
            if (alarm) {
                alarm.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
